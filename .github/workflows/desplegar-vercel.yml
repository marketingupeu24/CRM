# Revisa y despliega el panel en Vercel (https://crm-admision.vercel.app) en cada push a main.
# 1. revisar: tipos, ESLint, pruebas de la base de datos (migraciones y permisos) y de las funciones del bot.
# 2. desplegar: solo si la revisión pasó.
# Requiere el secreto VERCEL_TOKEN en GitHub: Settings > Secrets and variables > Actions.
# Sin el secreto, el despliegue se omite (no falla).
name: Revisar y desplegar panel

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Instalar dependencias
        run: npm ci

      - name: Tipos (panel y paquete compartido)
        run: npm run typecheck

      - name: ESLint del panel
        run: npm run lint

      - name: Pruebas de la base de datos (migraciones, permisos y RLS)
        run: npm run db:test

      - name: Funciones del bot (tipos, lint y pruebas)
        run: npm run fn:check

  desplegar:
    needs: revisar
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: vercel-produccion
      cancel-in-progress: true
    env:
      VERCEL_ORG_ID: team_pzoNmPxmOntLtDwjuiLw1CMC
      VERCEL_PROJECT_ID: prj_00flZyIpZal364jiAgdWnK8z9q1b
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Verificar token
        id: token
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "Falta el secreto VERCEL_TOKEN: se omite el despliegue."
            echo "hay=no" >> "$GITHUB_OUTPUT"
          else
            echo "hay=si" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.hay == 'si'

      - uses: actions/setup-node@v4
        if: steps.token.outputs.hay == 'si'
        with:
          node-version: 22

      - name: Desplegar en producción
        if: steps.token.outputs.hay == 'si'
        run: npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
